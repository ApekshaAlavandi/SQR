[project]
name = "scout-ai"
version = "0.1.0"
description = "Service that runs AI analysis over downsized videos in GCS using Gemini (Vertex AI)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "google-genai>=1.0",
    "google-cloud-storage>=2.18",
    "google-cloud-pubsub>=2.27",
]

[project.scripts]
scout-ai-consumer = "scout_ai.transport.pubsub.worker:main"
scout-ai-local = "scout_ai.transport.local.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
