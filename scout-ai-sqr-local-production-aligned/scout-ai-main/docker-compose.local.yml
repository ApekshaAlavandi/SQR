# Local Postgres for `scout-ai-local` — the only external dependency of local mode.
#   docker compose -f docker-compose.local.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    volumes:
      - scout-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  scout-local-pgdata:
